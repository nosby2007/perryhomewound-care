name: Validate and Deploy PHWC Firebase

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phwc-firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run PHWC site checks
        shell: pwsh
        run: ./scripts/check-site.ps1

  deploy-firebase:
    name: Deploy PHWC Firebase
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: 'github-phwc-hosting@credential-4f22b.iam.gserviceaccount.com'
          project_id: credential-4f22b

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Hosting and Firestore rules
        run: firebase deploy --only hosting,firestore:rules --project credential-4f22b --non-interactive

      - name: Deploy Storage rules
        id: storage_rules
        continue-on-error: true
        run: firebase deploy --only storage --project credential-4f22b --non-interactive

      - name: Storage deployment warning
        if: steps.storage_rules.outcome == 'failure'
        run: |
          echo "::warning::PHWC Hosting and Firestore rules were deployed, but Storage rules were not."
          echo "::warning::Grant the deployment service account permission to inspect/enable Firebase Storage API before enabling referral document uploads."
