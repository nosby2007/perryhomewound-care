<!DOCTYPE html><html lang="en"><head>
    <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Bookings — Admin</title>
    <link rel="stylesheet" href="/admin/admin-shared.css"/>
    </head>
    <body>
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <div class="logo">PH</div>
          <div class="btxt">
            <strong>Perry Home</strong>
            <span class="muted">Admin</span>
          </div>
        </div>
        <nav class="snav">
          <a class="sitem" data-target="tasks"    href="/admin/tasks.html">Tasks</a>
          <a class="sitem active" data-target="bookings" href="/admin/bookings.html">Bookings</a>
          <a class="sitem" data-target="contacts" href="/admin/contacts.html">Contacts</a>
          <a class="sitem" data-target="referrals" href="/admin/referrals.html">Referrals</a>
          <a class="sitem" data-target="users"    href="/admin/users.html">Users</a>
        </nav>
        <div class="sfoot">
          <span id="who" class="small muted"></span>
          <button id="logoutBtn" class="btn wfull">Sign out</button>
        </div>
      </aside>
    
      <div class="main">
        <header class="topbar"><h1>Bookings</h1></header>
        <section class="wrap">
          <div class="phead">
            <div class="filters">
              <select id="fBookingStatus">
                <option value="">All</option>
                <option>pending</option><option>scheduled</option>
                <option>completed</option><option>cancelled</option>
              </select>
              <input id="qBookings" class="inp" placeholder="Search name/email/service…"/>
            </div>
          </div>
    
          <div class="tablewrap">
            <table class="tbl" id="tblBookings">
              <thead>
                <tr>
                  <th>When</th><th>Patient</th><th>Contact</th>
                  <th>Service</th><th>Status</th><th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </section>
      </div>
    
      <script type="module">
        import { mountSidebar } from "/admin/admin-shared.js";
        mountSidebar("bookings");
      </script>
      <script type="module" src="./bookings.js"></script>
    </html>
